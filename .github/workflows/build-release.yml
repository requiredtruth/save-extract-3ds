name: Build and Release 3DSX

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host filesystem tests
        run: make -f Makefile.host test

  build:
    needs: test
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DSX
        run: make
      - name: Verify artifact
        run: test -s save-extract-3ds.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: save-extract-3ds-3dsx
          path: save-extract-3ds.3dsx
      - name: Resolve release tag
        id: version
        if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish versioned release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Save Extract 3DS ${{ steps.version.outputs.tag }}
          body: |
            Compiled and tested Homebrew Launcher release.

            Put `save-extract-3ds.3dsx` in `sd:/3ds/save-extract-3ds/`.

            Backups are written transactionally to `sd:/3ds/SaveBackup`.
            When multiple Nintendo 3DS profiles are detected, the app asks
            which one to back up or restore.
          files: save-extract-3ds.3dsx
          fail_on_unmatched_files: true
          overwrite_files: true
